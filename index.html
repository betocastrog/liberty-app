<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liberty - Finanzas Personales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="index.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="pwa_icon_512.png">
</head>

<body>
    <div id="app">
        <header class="top-header">
            <span class="app-logo">Liberty</span>
            <div class="switch-wrapper">
                <button id="btn-logout" class="btn-logout" title="Cerrar Sesión" style="display: none;">
                    <span class="material-symbols-rounded">logout</span>
                </button>
                <label class="switch">
                    <input type="checkbox" id="btn-toggle-theme">
                    <span class="slider round"></span>
                </label>
                <span id="current-date" class="date-display"></span>
            </div>
        </header>
        <main id="screen-container"></main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-screen="dashboard">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Hoy</span>
            </button>
            <button class="nav-item" data-screen="goals">
                <span class="nav-icon">🎯</span>
                <span class="nav-label">Metas</span>
            </button>
            <button class="nav-btn-add" data-screen="register">
                <span class="nav-icon">+</span>
            </button>
            <button class="nav-item" data-screen="analysis">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Análisis</span>
            </button>
            <button class="nav-item" data-screen="kpis">
                <span class="nav-icon">📈</span>
                <span class="nav-label">KPIs</span>
            </button>
        </nav>
    </div>

    <script src="js/state.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
